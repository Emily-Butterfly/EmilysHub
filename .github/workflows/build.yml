name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to full commit SHAs so a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      # Validates the Gradle wrapper checksum; basic = open-source caching on GitHub's cache.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build-Logik testen
        run: ./gradlew :build-logic:test

      # assemble* runs verify*ManifestPolicy first: no INTERNET permission, only the app's launcher
      # exported, backups off. A dependency that breaks this fails the build.
      - name: Lint, Unit-Tests, Debug- und Release-Build
        run: ./gradlew lint testDebugUnitTest assembleDebug assembleRelease

      # The build re-exports the Room schema; a difference means a schema change without its committed export.
      - name: Datenbank-Schema im Repo prüfen
        run: |
          git status --porcelain -- app/schemas
          test -z "$(git status --porcelain -- app/schemas)"

      - name: Debug-APK hochladen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emilyshub-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # The only step that sees the signing secrets (docs/release-signierung.md). Without any of them
      # it skips signing; with only some of them it fails, since that is a setup mistake.
      - name: Release-APK signieren
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -eq 4 ]; then
            echo "::notice::Release-APK nicht signiert: Die Signatur-Secrets fehlen (siehe docs/release-signierung.md)."
            exit 0
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Diese Signatur-Secrets fehlen: ${missing[*]} (siehe docs/release-signierung.md)."
            exit 1
          fi

          export RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$RELEASE_KEYSTORE"' EXIT
          # --ignore-garbage skips line breaks, e.g. from a secret pasted on Windows.
          base64 --decode --ignore-garbage <<< "$KEYSTORE_BASE64" > "$RELEASE_KEYSTORE"
          ./gradlew assembleRelease

          # The certificate fingerprint must be the same in every build, or the APK cannot update the installed app.
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep 'SHA-256'
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Signierte Release-APK hochladen
        if: steps.sign.outputs.signed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emilyshub-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Berichte bei Fehlern hochladen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: berichte
          path: |
            app/build/reports/
            build-logic/build/reports/
          if-no-files-found: ignore

  # SQLCipher and the Android Keystore only exist on a real Android system, so their tests run on an emulator.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # Built before the emulator starts, so it boots only once everything compiles.
      - name: App und Tests bauen
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: KVM für den Emulator freischalten
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 = Android 14, as on the A52.
      - name: Instrumentierte Tests auf dem Emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      # Gradle prints no test count for device tests; this shows how many ran, failed and were skipped.
      - name: Ergebnis der instrumentierten Tests
        if: always()
        run: find app/build/outputs/androidTest-results -name 'TEST-*.xml' -exec grep -oh '<testsuite [^>]*' {} + || true

      - name: Berichte bei Fehlern hochladen
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: berichte-instrumentiert
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
